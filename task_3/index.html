<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Pendaftaran</title>
    <style>
        .container {
            display: flex;
            justify-content: center;
        }
        .box {
            width: 35%;
            padding: 10px;
        }
        fieldset {
            border: solid 1pt black;
            border-radius: 8pt;
            padding: 15px;
        }
        legend {
            font-weight: bold;
            text-align: center;
        }

        input[type="text"], input[type="password"], input[type="email"], input[type="date"], select, textarea {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
        }

        #submit-button {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <form action="detail.html" method="get">
                <fieldset>
                    <legend>Formulir Pendaftaran</legend>
                    <label for="nama">Nama:</label>
                    <input type="text" id="nama" name="nama" placeholder="Masukkan nama"><br><br>

                    <label for="nim">NIM:</label>
                    <input type="text" id="nim" name="nim" placeholder="Masukkan NIM"><br><br>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="contoh@email.com"><br><br>

                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" placeholder="Masukkan password"><br><br>

                    <label for="prodi">Program Studi:</label>
                    <select id="prodi" name="prodi">
                        <option value="">Pilih Program Studi</option>
                        <option value="Teknik Informatika">Teknik Informatika</option>
                        <option value="Teknik Elektro">Teknik Pertambangan</option>
                        <option value="Sains Data">Sains Aktuaria</option>
                    </select><br><br>

                    <label for="jenis_kelamin">Jenis Kelamin:</label><br>
                    <input type="radio" id="laki-laki" name="jenis_kelamin" value="laki-laki">
                    <label for="laki-laki">Laki-laki</label><br>
                    <input type="radio" id="perempuan" name="jenis_kelamin" value="perempuan">
                    <label for="perempuan">Perempuan</label><br><br>
                    <label for="hobi">Hobi:</label><br>
                    <input type="checkbox" id="membaca" name="hobi" value="membaca">
                    <label for="membaca">Membaca</label><br>
                    <input type="checkbox" id="olahraga" name="hobi" value="olahraga">
                    <label for="olahraga">Olahraga</label><br>
                    <input type="checkbox" id="musik" name="hobi" value="musik">
                    <label for="musik">Musik</label><br><br>

                    <label for="tanggal_lahir">Tanggal Lahir:</label>
                    <input type="date" id="tanggal_lahir" name="tanggal_lahir"><br><br>

                    <label for="pesan">Alamat:</label><br>
                    <textarea id="pesan" name="alamat" placeholder="Masukkan alamat"></textarea><br><br>

                    <div id="submit-button">
                        <button type="submit">Kirim</button>
                    </div>
                </fieldset>
            </form>
        </div>
    </div>
</body>
</html>
